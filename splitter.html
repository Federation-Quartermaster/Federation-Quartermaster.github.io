<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Asset Splitter - Federation Quartermaster</title>
    <style>
        /* Reset and Full Screen Layout */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
        }

        /* Top Header & Controls */
        .top-bar {
            flex-shrink: 0;
            background: #181825;
            padding: 15px 20px;
            border-bottom: 2px solid #313244;
        }
        .top-bar h1 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
            color: #89b4fa;
        }
        .control-panel {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Inputs & Buttons */
        input[type="file"] {
            background: #45475a;
            border: 1px solid #585b70;
            color: #cdd6f4;
            border-radius: 4px;
            padding: 6px;
        }
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #313244;
            padding: 6px 12px;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #74c7ec; }
        button.danger { background-color: #f38ba8; }
        button.danger:hover { background-color: #f5a97f; }

        /* Main Workspace Area */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Canvas Container */
        .canvas-container {
            flex: 1;
            background: #11111b;
            overflow: auto;
            position: relative;
            cursor: crosshair;
            padding: 20px;
        }
        
        /* The Canvas itself */
        canvas {
            display: block;
            image-rendering: pixelated; /* Keeps image crisp when zoomed */
            transform-origin: top left;
            background: transparent;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Right Sidebar for Outputs */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: #181825;
            border-left: 2px solid #313244;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            background: #313244;
            font-weight: bold;
            text-align: center;
        }
        #output-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Output Items */
        .sprite-box {
            background: #1e1e2e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .sprite-box img {
            max-width: 100%;
            image-rendering: pixelated;
        }
        .download-btn {
            padding: 6px 12px;
            background: #a6e3a1;
            color: #11111b;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }
        .download-btn:hover { background: #94e2d5; }
        
        .help-text {
            font-size: 0.85em;
            color: #a6adc8;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Visual Asset Splitter</h1>
        <div class="control-panel">
            <input type="file" id="imageUpload" accept="image/png, image/jpeg">
            
            <div class="zoom-controls">
                <label for="zoomSlider">Zoom:</label>
                <input type="range" id="zoomSlider" min="1" max="15" step="0.5" value="1">
                <span id="zoomLabel">100%</span>
            </div>

            <button id="undoBtn">Undo Last</button>
            <button id="clearBtn" class="danger">Clear All</button>
            <button id="splitBtn">Extract Selected</button>
            
            <span class="help-text"><em>Tip: Hold Ctrl + Scroll Wheel to zoom</em></span>
        </div>
    </div>

    <div class="workspace">
        <!-- Canvas Area -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="workspaceCanvas"></canvas>
        </div>

        <!-- Extracted Assets Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Extracted Assets</div>
            <div id="output-container">
                <div style="text-align:center; color:#6c7086; margin-top: 20px;">
                    Assets will appear here.
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const workspaceCanvas = document.getElementById('workspaceCanvas');
        const canvasContainer = document.getElementById('canvasContainer');
        const ctx = workspaceCanvas.getContext('2d');
        
        const splitBtn = document.getElementById('splitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomLabel = document.getElementById('zoomLabel');
        const outputContainer = document.getElementById('output-container');
        
        let sourceImage = new Image();
        let selections = [];
        let isDrawing = false;
        
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let zoomLevel = 1;

        function applyZoom() {
            workspaceCanvas.style.transform = `scale(${zoomLevel})`;
            zoomLabel.textContent = `${Math.round(zoomLevel * 100)}%`;
            zoomSlider.value = zoomLevel;
        }

        zoomSlider.addEventListener('input', function(e) {
            zoomLevel = parseFloat(e.target.value);
            applyZoom();
        });

        canvasContainer.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
                const zoomStep = 0.5;
                if (e.deltaY < 0) {
                    zoomLevel = Math.min(15, zoomLevel + zoomStep);
                } else {
                    zoomLevel = Math.max(1, zoomLevel - zoomStep);
                }
                applyZoom();
            }
        });

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                sourceImage.onload = function() {
                    workspaceCanvas.width = sourceImage.width;
                    workspaceCanvas.height = sourceImage.height;
                    selections = [];
                    zoomLevel = 1;
                    applyZoom();
                    redrawCanvas();
                }
                sourceImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Use Math.floor to snap exactly to integer pixels
        function getMousePos(e) {
            const rect = workspaceCanvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / zoomLevel),
                y: Math.floor((e.clientY - rect.top) / zoomLevel)
            };
        }

        workspaceCanvas.addEventListener('mousedown', function(e) {
            if (!sourceImage.src) return;
            isDrawing = true;
            const pos = getMousePos(e);
            startX = pos.x;
            startY = pos.y;
            currentX = startX;
            currentY = startY;
        });

        workspaceCanvas.addEventListener('mousemove', function(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            currentX = pos.x;
            currentY = pos.y;
            redrawCanvas();
        });

        workspaceCanvas.addEventListener('mouseup', function(e) {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = {
                x: Math.min(startX, currentX),
                y: Math.min(startY, currentY),
                w: Math.abs(currentX - startX),
                h: Math.abs(currentY - startY)
            };

            if (rect.w > 0 && rect.h > 0) {
                selections.push(rect);
            }
            redrawCanvas();
        });

        workspaceCanvas.addEventListener('mouseleave', function(e) {
            if (isDrawing) {
                isDrawing = false;
                redrawCanvas();
            }
        });

        function redrawCanvas() {
            if (!sourceImage.src) return;
            
            // Force strict pixel rendering
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, workspaceCanvas.width, workspaceCanvas.height);
            ctx.drawImage(sourceImage, 0, 0);

            ctx.lineWidth = 1;

            selections.forEach(rect => {
                ctx.strokeStyle = '#a6e3a1';
                ctx.fillStyle = 'rgba(166, 227, 161, 0.2)';
                ctx.beginPath();
                // Add 0.5 to bypass sub-pixel antialiasing
                ctx.rect(rect.x + 0.5, rect.y + 0.5, rect.w, rect.h);
                ctx.fill();
                ctx.stroke();
            });

            if (isDrawing) {
                const rx = Math.min(startX, currentX);
                const ry = Math.min(startY, currentY);
                const rw = Math.abs(currentX - startX);
                const rh = Math.abs(currentY - startY);

                ctx.strokeStyle = '#f9e2af';
                ctx.fillStyle = 'rgba(249, 226, 175, 0.3)';
                ctx.beginPath();
                // Add 0.5 to bypass sub-pixel antialiasing
                ctx.rect(rx + 0.5, ry + 0.5, rw, rh);
                ctx.fill();
                ctx.stroke();
            }
        }

        clearBtn.addEventListener('click', () => {
            selections = [];
            redrawCanvas();
            if(selections.length === 0 && !sourceImage.src) {
                outputContainer.innerHTML = '<div style="text-align:center; color:#6c7086; margin-top: 20px;">Assets will appear here.</div>';
            }
        });

        undoBtn.addEventListener('click', () => {
            selections.pop();
            redrawCanvas();
        });

        splitBtn.addEventListener('click', function() {
            if (selections.length === 0) {
                alert("Please draw at least one selection box on the image first.");
                return;
            }

            outputContainer.innerHTML = '';

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;

            selections.forEach((rect, index) => {
                tempCanvas.width = rect.w;
                tempCanvas.height = rect.h;
                
                tempCtx.clearRect(0, 0, rect.w, rect.h);
                tempCtx.drawImage(
                    sourceImage, 
                    rect.x, rect.y, rect.w, rect.h, 
                    0, 0, rect.w, rect.h
                );

                const dataURL = tempCanvas.toDataURL('image/png');
                
                const box = document.createElement('div');
                box.className = 'sprite-box';
                
                const label = document.createElement('div');
                label.style.fontSize = '0.8em';
                label.style.color = '#a6adc8';
                label.textContent = `${rect.w}x${rect.h} px`;

                const imgElem = document.createElement('img');
                imgElem.src = dataURL;
                
                const downloadBtn = document.createElement('a');
                downloadBtn.href = dataURL;
                downloadBtn.download = `asset_cut_${index + 1}.png`;
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = 'Download';

                box.appendChild(label);
                box.appendChild(imgElem);
                box.appendChild(downloadBtn);
                outputContainer.appendChild(box);
            });
        });
    </script>
</body>
</html>
